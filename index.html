<style>
/* Layout: single phone-width column, sticky top bar, fixed bottom tab bar; sheets slide over for editing. Gym-steel neutrals, ultraviolet for actions, a blood-warm heat scale reserved for muscle load. */
:root{
  --bg:#e9ecef; --surface:#ffffff; --raise:#f4f6f8; --fg:#14181d; --muted:#5b6571; --line:#d3d9df;
  --accent:#4f2bd0; --accent-fg:#ffffff; --accent-soft:#e9e3fc;
  --sil:#d9dee4; --sil-line:#6f7a87; --seam:rgba(40,30,30,.38); --panel:#dde2e8; --panel-hi:#f7f9fb;
  --h0:#58616e; --h1:#6e3328; --h2:#b0452a; --h3:#f3702c; --h4:#ff2d4a; --ink:#16171c; --burst:rgba(79,43,208,.07);
  --good:#1f7a4d; --warn:#b4542a;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1215; --surface:#181c21; --raise:#20252b; --fg:#e6e9ed; --muted:#8e98a4; --line:#2a3038;
  --accent:#8a63ff; --accent-fg:#0f0a20; --accent-soft:#211a3d;
  --sil:#2a313a; --sil-line:#6a7584; --seam:rgba(0,0,0,.55); --panel:#0c0f12; --panel-hi:#1e252d;
  --h0:#58616e; --h1:#6e3328; --h2:#b0452a; --h3:#f3702c; --h4:#ff2d4a; --ink:#030405; --burst:rgba(138,99,255,.07);
  --good:#5cc994; --warn:#f0925e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f12; --surface:#161a1f; --raise:#1e2329; --fg:#e8ebef; --muted:#8b95a1; --line:#262c34;
  --accent:#8a63ff; --accent-fg:#0f0a20; --accent-soft:#211a3d;
  --sil:#2a313a; --sil-line:#6a7584; --seam:rgba(0,0,0,.55); --panel:#0c0f12; --panel-hi:#1e252d;
  --h0:#58616e; --h1:#6e3328; --h2:#b0452a; --h3:#f3702c; --h4:#ff2d4a; --ink:#030405; --burst:rgba(138,99,255,.07);
  --good:#4fd08f; --warn:#f0925e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.top small{color:var(--muted);font-size:12px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:22px} h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
section.view{display:flex;flex-direction:column;gap:18px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px dashed var(--accent)}
.btn.quiet{background:var(--raise);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.wide{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.txt{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 4px}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
input,select{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--raise);border:1px solid var(--line);color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.pr{background:var(--good);border-color:var(--good);color:var(--surface);font-size:10px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Week / body map */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weekbar .lbl{text-align:center}
.weekbar .lbl strong{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:end}
.bodies figure{margin:0;text-align:center}
.bodies figcaption{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7d8794;margin-top:4px}
.bodies svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto;overflow:visible}
.bodypanel{border-radius:var(--r);background:radial-gradient(ellipse 70% 55% at 50% 40%,#262c35 0%,#15181d 60%,#0d0f12 100%);padding:14px 4px 10px;border:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.sil{fill:#08090b;stroke:none}
.skinp{fill:#2a2f37;stroke:none}
.bodyshade{fill:url(#bshade);stroke:none;pointer-events:none}
.lines{fill:#050607;opacity:.85;pointer-events:none}
.vol,.outline,.spec{pointer-events:none}
.vol{fill:url(#vol)}
.spec{fill:url(#spec)}
.outline{fill:none;stroke:rgba(150,175,205,.30);stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.mus{stroke:none;stroke-linejoin:round;cursor:pointer;transition:fill .35s,filter .35s}
.l0{fill:var(--h0)}.l1{fill:var(--h1)}.l2{fill:var(--h2)}
.l3{fill:var(--h3);filter:drop-shadow(0 0 2.5px rgba(255,130,50,.5))}
.l4{fill:var(--h4);filter:drop-shadow(0 0 4px rgba(255,40,70,.8))}
.mus.sel{stroke:#fff;stroke-width:1.4}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.musdetail{min-height:44px}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.statline div{background:var(--surface);padding:10px 12px}
.statline b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600}
.statline span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;font-size:13px;background:none;border:0;padding:2px 0;text-align:left}
.bar .track{height:10px;background:var(--raise);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:5px}
.bar .n{text-align:right;font-family:var(--f-num);font-size:13px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.wk{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wk .d{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.wk .t{font-weight:700;font-size:16px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet.top2{z-index:30}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sh-h h2{font-size:20px}
.sh-b{flex:1;overflow-y:auto;padding-block:16px calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-b>.inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.saving{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-name{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:16px;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.last{font-size:12px;color:var(--muted)}
.coach{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.35;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.coach .ci{font-size:14px}.coach>span:nth-child(2){flex:1}
.coach.go{background:rgba(79,208,143,.14)}
.coach.warn{background:rgba(240,146,94,.14)}
.mk{font-size:13px;font-weight:700}.mk.up{color:var(--good)}.mk.same{color:var(--muted)}.mk.down{color:var(--warn)}
.mkc{display:flex;justify-content:center}
.report-card{width:100%;border-color:var(--accent-soft)}
.report{font-size:15px;line-height:1.55;gap:8px}
.report .rp-h{font-size:20px;margin-top:10px}.report .rp-h3{font-size:16px;margin-top:6px}
.report p{margin:0}.report ul,.report ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px 32px;gap:6px;align-items:center}
.sets .hd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets .sn{font-family:var(--f-num);color:var(--muted);text-align:center}
.sets input{font-family:var(--f-num);text-align:center;padding:8px 4px}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pick small{color:var(--muted);font-size:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* stats */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent-soft);stroke:none}
.chart .dt{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.chart .end{fill:var(--accent);stroke:none}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-fg)}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--raise);border:2px solid transparent;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.on{border-color:var(--accent)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;font-family:var(--f-num);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--raise)}
.cmp figcaption{font-size:12px;font-family:var(--f-num)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600}
@media (max-width:380px){.bar{grid-template-columns:80px 1fr 34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Custom exercises that now have a built-in version. On startup (and after an import) any custom exercise
   whose name matches is merged into the built-in one: its workouts, routines and settings move over. */
const LIB_ALIASES={mshoulder:["machine shoulder press","shoulder press machine","machine overhead press"],
  mshrug:["machine shrugs","machine shrug","shrug machine"],
  smithuprow:["upright row (smith)","smith upright row","smith machine upright row"],
  revpec:["reverse pec deck","reverse pec dec","reverse fly machine","rear delt machine"],
  declcrunch:["decline weighted crunch","weighted decline crunch","decline crunch"],
  ffess:["ffe split squat","front foot elevated split squat","front-foot-elevated split squat"],
  lpcalf:["calf raise on leg press","leg press calf raise","calf press on leg press","calf press"],
  hkr:["hanging knee raise","hanging knee raises","hanging knee tuck"],
  hschest:["hammer strength chest press","hammer strength press","hs chest press","hammer chest press"],
  mincchest:["machine incline chest press","incline machine press","machine incline press","incline chest press machine"],
  chestdip:["chest dips","chest dip"],
  cablefly:["cable crossover","cable crossovers","cable cross over"],
  revpush:["reverse grip tricep pushdown","reverse grip triceps pushdown","reverse-grip pushdown","reverse grip pushdown"]};
const normName=n=>String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function mergeCore(prof,workoutRows){
  if(!prof||!(prof.custom||[]).length)return null;
  const byName={};Object.entries(LIB_ALIASES).forEach(([id,names])=>names.forEach(n=>byName[normName(n)]=id));
  const move={};prof.custom.forEach(c=>{const id=byName[normName(c.name)];if(id)move[c.id]=id});
  if(!Object.keys(move).length)return null;
  const fix=items=>(items||[]).forEach(it=>{if(move[it.ex])it.ex=move[it.ex]});
  prof.custom=prof.custom.filter(c=>!move[c.id]);
  (prof.routines||[]).forEach(r=>fix(r.items));
  const st=prof.exSettings||{};Object.entries(move).forEach(([from,to])=>{if(st[from]){if(!st[to])st[to]=st[from];delete st[from]}});
  const changed=[];for(const row of workoutRows){const w=row[1];if((w.items||[]).some(it=>move[it.ex])){fix(w.items);changed.push(row)}}
  return changed;
}
async function mergeCustomIntoLib(){
  const prof=await Local.get("meta","profile");if(!prof||!(prof.custom||[]).length)return;
  const rows=await Local.all("workouts");const changed=mergeCore(prof,rows);if(!changed)return;
  for(const [k,w] of changed)await Local.put("workouts",k,w);
  await Local.put("meta","profile",prof);
}
function mergeCustomInBackup(data){const pr=(data.meta||[]).find(([k])=>k==="profile");if(pr)mergeCore(pr[1],data.workouts||[])}

const lvl=n=>n<=0?0:n<4?1:n<8?2:n<12?3:4;
const LVL_LABEL=["0","1–3","4–7","8–11","12+"];

/* ---------- state ---------- */

/* ---------- on-device storage (IndexedDB) ----------
   A small stand-in for the old Claude storage API, so the rest of the app is unchanged.
   Stores: meta (profile, settings), workouts, stats, photos (photo info), blobs (photo files). */
const STORES=["meta","workouts","stats","photos","blobs"];
const Local=(()=>{
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{
    if(!("indexedDB" in window))return rej(new Error("no indexeddb"));
    const r=indexedDB.open("setrep",1);
    r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }));
  const wrapErr=e=>{if(e&&e.name==="QuotaExceededError"){const x=new Error("quota");x.code="quota_exceeded";return x}return e||new Error("storage error")};
  async function run(stores,mode,fn){
    const d=await open();
    return new Promise((res,rej)=>{
      let out;const t=d.transaction(stores,mode);
      const r=fn(t);if(r&&"onsuccess" in r)r.onsuccess=()=>{out=r.result};
      t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(wrapErr(t.error));
    });
  }
  const get=(st,k)=>run(st,"readonly",t=>t.objectStore(st).get(k));
  const put=(st,k,v)=>run(st,"readwrite",t=>t.objectStore(st).put(v,k));
  const del=(st,k)=>run(st,"readwrite",t=>t.objectStore(st).delete(k));
  async function all(st){
    const d=await open();
    return new Promise((res,rej)=>{
      const out=[];const t=d.transaction(st,"readonly");const c=t.objectStore(st).openCursor();
      c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}};
      t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(wrapErr(t.error));
    });
  }
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const subs={};
  async function notify(st){const rows=await all(st);(subs[st]||[]).forEach(f=>f(rows))}
  function collection(st){
    return{
      doc(id){id=id||newId();return{id,
        set:async v=>{await put(st,id,v);notify(st)},
        delete:async()=>{await del(st,id);notify(st)}}},
      orderBy(){return this},limit(){return this},
      onSnapshot(fn,onErr){
        const cb=rows=>fn({docs:rows.map(([k,v])=>({id:k,data:()=>v}))});
        (subs[st]=subs[st]||[]).push(cb);
        all(st).then(cb).catch(e=>onErr&&onErr(e));
      }
    };
  }
  const profile={
    set:async v=>{await put("meta","profile",v);notify("meta")},
    onSnapshot(fn,onErr){
      const cb=async()=>{const v=await get("meta","profile");fn({exists:v!=null,data:()=>v})};
      (subs.meta=subs.meta||[]).push(cb);cb().catch(e=>onErr&&onErr(e));
    },
    collection
  };
  const assets={
    upload:async blob=>{const id=newId();await put("blobs",id,blob);return{id}},
    delete:async id=>{await del("blobs",id)},
    get:id=>get("blobs",id)
  };
  async function dumpAll(){const o={};for(const st of STORES)o[st]=await all(st);return o}
  async function replaceAll(data){
    const d=await open();
    await new Promise((res,rej)=>{
      const t=d.transaction(STORES,"readwrite");
      STORES.forEach(st=>{const s=t.objectStore(st);s.clear();(data[st]||[]).forEach(([k,v])=>s.put(v,k))});
      t.oncomplete=res;t.onerror=t.onabort=()=>rej(wrapErr(t.error));
    });
    for(const st of STORES)await notify(st);
  }
  return{open,get,put,all,profile,assets,dumpAll,replaceAll};
})();
const exMap=()=>{const m={};LIB.concat(S.profile.custom||[]).forEach(e=>m[e.id]=e);return m};

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* ---------- body map ---------- */
function bodySVG(v,label){
  /* both views share one scale: same box size, each figure centred, feet on the same line */
  const dims=[BODY_VIEWS.front,BODY_VIEWS.back].map(o=>o.viewBox.split(" ").map(Number));
  const W=Math.max(...dims.map(d=>d[2])),H=Math.max(...dims.map(d=>d[3]));
  let [x,y,w,h]=v.viewBox.split(" ").map(Number);
  x-=(W-w)/2;y-=(H-h);w=W;h=H;
  const skin=v.skin.map(d=>`<path class="skinp" d="${d}"/>`).join("");
  const paths=v.regions.map(([m,d])=>`<path class="mus l0" data-m="${m}" d="${d}"><title>${MUSCLES[m]}</title></path>`).join("");
  const vol=v.regions.map(([m,d])=>`<path class="vol" d="${d}"/><path class="spec" d="${d}"/>`).join("");
  return `<svg viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="${label}"><ellipse cx="${x+w/2}" cy="${y+h-4}" rx="${w*.3}" ry="5" fill="url(#floor)"/>
  <path class="sil" d="${v.sil}"/>${skin}<path class="bodyshade" d="${v.sil}"/>${paths}${vol}<path class="lines" d="${v.lines}"/><path class="outline" d="${v.sil}"/></svg>`;
}
const BODY_DEFS=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="vol" cx=".45" cy=".4" r=".72"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".05"/><stop offset=".85" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<radialGradient id="spec" cx=".34" cy=".26" r=".42"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="bshade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fc0e6" stop-opacity=".10"/><stop offset=".12" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset=".88" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#9fc0e6" stop-opacity=".10"/></linearGradient>
<radialGradient id="floor"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs></svg>`;
function weekRange(off){const s=addDays(monday(new Date()),off*7);return[ymd(s),ymd(addDays(s,6)),s]}
/* Muscle map scoring. Each set scores: role (primary 1, secondary 0.5)
   x heaviness vs. your own top weight on that exercise over the 8 weeks up to that day
   (90%+ of it = 1.0, 70-90% = 0.8, lighter = 0.5; bodyweight set = 0.7)
   x 0.8 if only 1-3 reps. Raw pounds aren't used because hard sets build muscle about
   the same across a wide range of weights; this way legs don't always outscore arms. */
const SCORE_WEEKS=8;
function setIntensity(ex,s,date,tops){
  const w=+s.w||0;let f;
  if(!w)f=0.7;
  else{const from=ymd(addDays(pdate(date),-SCORE_WEEKS*7));let top=w;
    (tops[ex]||[]).forEach(([d,t])=>{if(d>=from&&d<=date&&t>top)top=t});
    const r=w/top;f=r>=0.9?1:r>=0.7?0.8:0.5}
  if(s.r>0&&s.r<=3)f*=0.8;
  return f;
}
function topWeights(){const t={};S.workouts.forEach(o=>(o.items||[]).forEach(it=>{const m=Math.max(0,...(it.sets||[]).filter(s=>s&&s.r>0).map(s=>+s.w||0));if(m>0)(t[it.ex]=t[it.ex]||[]).push([o.date,m])}));return t}
function muscleLoad(ws){
  const load={},src={};Object.keys(MUSCLES).forEach(m=>{load[m]=0;src[m]={}});
  const ex=exMap(),tops=topWeights();
  ws.forEach(w=>(w.items||[]).forEach(it=>{
    const e=ex[it.ex];if(!e)return;
    const n=(it.sets||[]).filter(s=>s&&s.r>0).reduce((a,s)=>a+setIntensity(it.ex,s,w.date,tops),0);if(!n)return;
    e.p.forEach(m=>{load[m]+=n;src[m][e.name]=(src[m][e.name]||0)+n});
    e.s.forEach(m=>{load[m]+=n*0.5;src[m][e.name]=(src[m][e.name]||0)+n*0.5});
  }));
  return{load,src};
}

/* ---------- views ---------- */
function viewWeek(){
  const[a,b,start]=weekRange(S.weekOff);
  const ws=S.workouts.filter(w=>w.date>=a&&w.date<=b);
  const{load,src}=muscleLoad(ws);
  let sets=0,vol=0;ws.forEach(w=>(w.items||[]).forEach(it=>(it.sets||[]).forEach(s=>{if(s&&s.r>0){sets++;vol+=(s.w||0)*s.r}})));
  const label=S.weekOff===0?"This week":S.weekOff===-1?"Last week":`${fmtShort(a)} week`;
  const ranked=Object.keys(MUSCLES).sort((x,y)=>load[y]-load[x]);
  const max=Math.max(12,...ranked.map(m=>load[m]));
  const sel=S.selM;
  let detail=`<span class="muted">Tap a muscle to see what hit it.</span>`;
  if(sel){const list=Object.entries(src[sel]).sort((x,y)=>y[1]-x[1]);
    detail=`<div class="row between"><h3>${MUSCLES[sel]}</h3><span class="num">${fmtN(load[sel])} sets</span></div>`+
    (list.length?`<div class="muted" style="font-size:13px">${list.map(([n,c])=>`${esc(n)} <span class="num">×${fmtN(c)}</span>`).join(" · ")}</div>`:`<div class="muted" style="font-size:13px">Not trained this week.</div>`);}
  return `<section class="view">
  <div class="weekbar">
    <button class="icon-btn" data-act="wk" data-d="-1" aria-label="Previous week">‹</button>
    <div class="lbl"><strong>${label}</strong><span class="muted num" style="font-size:12px">${fmtShort(a)} – ${fmtShort(b)}</span></div>
    <button class="icon-btn" data-act="wk" data-d="1" aria-label="Next week" ${S.weekOff>=0?"disabled style='opacity:.35'":""}>›</button>
  </div>
  <div class="card stack">
    <div class="bodies bodypanel" id="bodies">
      <figure>${bodySVG(BODY_VIEWS.front,"Front muscles")}<figcaption>Front</figcaption></figure>
      <figure>${bodySVG(BODY_VIEWS.back,"Back muscles")}<figcaption>Back</figcaption></figure>
    </div>
    <div class="legend"><span class="eyebrow" style="margin-right:2px">Sets</span>${[0,1,2,3,4].map(i=>`<span><i class="l${i}" style="background:var(--h${i})"></i>${LVL_LABEL[i]}</span>`).join("")}</div>
    <div class="musdetail">${detail}</div>
  </div>
  ${S.weekOff===0?reportCardHTML():""}
  <div class="statline">
    <div><span>Workouts</span><b>${ws.length}</b></div>
    <div><span>Working sets</span><b>${sets}</b></div>
    <div><span>Volume ${U()}</span><b>${vol>=10000?Math.round(vol/1000)+"k":Math.round(vol).toLocaleString()}</b></div>
  </div>
  ${ws.length?`<div class="stack"><div class="eyebrow">Effective sets per muscle · weighted by how heavy</div><div class="bars">${ranked.map(m=>`<button class="bar" data-act="selm" data-m="${m}"><span>${MUSCLES[m]}</span><span class="track"><span class="fill" style="display:block;width:${(load[m]/max*100).toFixed(1)}%;background:var(--h${Math.max(1,lvl(load[m]))})"></span></span><span class="n">${fmtN(load[m])}</span></button>`).join("")}</div></div>`
  :`<div class="empty"><strong style="color:var(--fg)">No sets logged ${S.weekOff===0?"yet this week":"this week"}</strong>Log a workout and the body map fills in by how hard each muscle worked.<button class="btn" data-act="newwk">Start a workout</button></div>`}
  </section>`;
}
function paintBodies(){
  const[a,b]=weekRange(S.weekOff);
  const{load}=muscleLoad(S.workouts.filter(w=>w.date>=a&&w.date<=b));
  document.querySelectorAll("#bodies [data-m]").forEach(p=>{const m=p.dataset.m;p.setAttribute("class",`mus l${lvl(load[m])}${S.selM===m?" sel":""}`);p.querySelector("title").textContent=`${MUSCLES[m]}: ${fmtN(load[m])} sets`});
}
function wSummary(w){
  const ex=exMap();const ms={};let n=0;
  (w.items||[]).forEach(it=>{const c=(it.sets||[]).filter(s=>s&&s.r>0).length;n+=c;(ex[it.ex]?.p||[]).forEach(m=>ms[m]=(ms[m]||0)+c)});
  const top=Object.entries(ms).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>MUSCLES[x[0]]);
  return{n,top,count:(w.items||[]).length};
}

  :`<div class="empty"><strong style="color:var(--fg)">Your log is empty</strong>Start a blank workout, or build a routine first so you can run it with one tap.</div>`}

function viewRoutines(){

const METRICS={weight:["Body weight",()=>U()],bf:["Body fat","%"],waist:["Waist",()=>U()==="kg"?"cm":"in"],chest:["Chest",()=>U()==="kg"?"cm":"in"],arms:["Arms",()=>U()==="kg"?"cm":"in"],thighs:["Thighs",()=>U()==="kg"?"cm":"in"]};
const unitOf=k=>{const u=METRICS[k][1];return typeof u==="function"?u():u};
function lineChart(pts,unit){
  if(pts.length<2)return `<div class="muted" style="font-size:13px;padding:8px 0">Add at least two entries to see a trend.</div>`;
  const W=340,H=170,l=38,r=12,t=12,b=24;
  const xs=pts.map(p=>pdate(p.d).getTime()),ys=pts.map(p=>p.v);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;
  let y0=Math.min(...ys),y1=Math.max(...ys);const padY=(y1-y0)*0.15||1;y0-=padY;y1+=padY;
  const X=x=>l+(x-x0)/(x1-x0)*(W-l-r),Y=y=>t+(1-(y-y0)/(y1-y0))*(H-t-b);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  const area=`${d} L${X(xs[xs.length-1]).toFixed(1)} ${H-b} L${X(xs[0]).toFixed(1)} ${H-b} Z`;
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const last=pts[pts.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
  ${ticks.map(v=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${l-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${fmtN(v)}</text>`).join("")}
  <path class="ar" d="${area}"/><path class="ln" d="${d}"/>
  ${pts.slice(0,-1).map((p,i)=>`<circle class="dt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"/>`).join("")}
  <circle class="end" cx="${X(xs[xs.length-1]).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5"/>
  <text x="${l}" y="${H-6}">${fmtShort(pts[0].d)}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${fmtShort(last.d)}</text>
  </svg></div>`;
}
function viewStats(){
  const k=S.metric;const st=[...S.stats].sort((a,b)=>a.date<b.date?-1:1);
  const pts=st.filter(s=>s[k]!=null).map(s=>({d:s.date,v:s[k]}));

    <div class="grid3"><label>Body fat %<input id="st-bf" inputmode="decimal"></label><label>Waist (${lu})<input id="st-waist" inputmode="decimal"></label><label>Chest (${lu})<input id="st-chest" inputmode="decimal"></label></div>
    <div class="grid3"><label>Arms (${lu})<input id="st-arms" inputmode="decimal"></label><label>Thighs (${lu})<input id="st-thighs" inputmode="decimal"></label><div style="display:flex;align-items:flex-end"><button class="btn wide" type="submit">Save</button></div></div>
  </form>

    ${pts.length?`<div class="row" style="align-items:baseline;gap:8px"><span class="num" style="font-size:28px;font-weight:600">${fmtN(last.v)}</span><span class="muted">${unitOf(k)}</span>${delta!=null?`<span class="num" style="color:${delta<=0?"var(--good)":"var(--warn)"};font-size:13px">${delta>0?"+":""}${fmtN(delta)} since ${fmtShort(first.d)}</span>`:""}</div>`:""}
    ${pts.length?lineChart(pts,unitOf(k)):`<div class="muted" style="font-size:13px">No ${METRICS[k][0].toLowerCase()} entries yet. Add one above.</div>`}
  </div>
  ${st.length?`<div class="card tscroll"><table><thead><tr><th>Date</th><th>Wt</th><th>BF%</th><th>Waist</th><th>Chest</th><th>Arms</th><th>Thighs</th><th></th></tr></thead><tbody>${[...st].reverse().map(s=>`<tr><td>${fmtShort(s.date)}</td>${["weight","bf","waist","chest","arms","thighs"].map(f=>`<td>${fmtN(s[f])}</td>`).join("")}<td>${S.confirm==="st:"+s.date?`<button class="txt" style="color:var(--warn)" data-act="delst" data-d="${s.date}">Delete</button>`:`<button class="x" data-act="ask" data-k="st:${s.date}" aria-label="Delete entry">×</button>`}</td></tr>`).join("")}</tbody></table></div>`:""}
  </section>`;
}
function weightNear(date){const st=S.stats.filter(s=>s.weight!=null&&s.date<=date).sort((a,b)=>a.date<b.date?1:-1);return st[0]?st[0].weight:null}

/* ---------- progressive-overload coach ----------

  const c=(S.profile.exSettings||{})[ex]||{};const e=exMap()[ex];const lower=!!(e&&e.p.some(m=>LOWER_BODY.has(m)));const kg=U()==="kg";
  return{min:c.min||8,max:c.max||12,inc:c.inc||(lower?(kg?5:10):(kg?2.5:5)),custom:!!(c.min||c.max||c.inc)};
}
function sessionsFor(ex,w,skipId){

    (o.items||[]).filter(i=>i.ex===ex).forEach(it=>{const ss=(it.sets||[]).filter(s=>s&&s.r>0);
      if(ss.length)out.push({date:o.date,created:o.created||0,sets:ss,e:Math.max(...ss.map(s=>e1rm(s.w,s.r))),vol:ss.reduce((a,s)=>a+(s.w||0)*s.r,0)})})});

  const last=ss[0];const top=Math.max(...last.sets.map(s=>s.w||0));
  const work=last.sets.filter(s=>(s.w||0)===top);

  if(top>0&&work.length&&work.every(s=>s.r>=c.max)){const nw=Math.round((top+c.inc)*100)/100;kind="up";targets=last.sets.map(()=>({w:nw,r:c.min}))}

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function dataURLToBlob(u){const[h,b64]=u.split(",");const type=(h.match(/data:([^;]+)/)||[])[1]||"application/octet-stream";const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type})}

const b64=str=>{const bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)};

/* tiny, safe markdown for Claude's report: headings, bullets, numbered items, bold, italics */
function mdToHTML(md){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>");
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  md.replace(/^<!--[\s\S]*?-->\s*/,"").split(/\r?\n/).forEach(l=>{
    let m;
    if(m=l.match(/^#{1,2}\s+(.*)/)){close();out.push(`<h2 class="rp-h">${inline(m[1])}</h2>`)}
    else if(m=l.match(/^#{3,6}\s+(.*)/)){close();out.push(`<h3 class="rp-h3">${inline(m[1])}</h3>`)}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push(`<li>${inline(m[1])}</li>`)}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push(`<li>${inline(m[1])}</li>`)}
    else if(!l.trim()){close()}
    else{close();out.push(`<p>${inline(l)}</p>`)}
  });close();return out.join("");
}

    case"openw":openWorkout(d.id);break;
    case"closew":{const e=S.edit;if(e.dirty&&e.w.items.length===0&&!e.saved)e.dirty=false;await flush(e);
      const sum=e.touched&&e.saved&&e.stage!=="start"?summarize(e):null;
      S.edit=sum&&sum.sets?{kind:"summary",sum}:null;S.confirm=null;renderSheet();renderView();if(e.saved)queueSync();break}
    case"syncsave":t.disabled=true;t.textContent="Connecting…";await saveSyncSettings();if(t.isConnected){t.disabled=false;t.textContent="Connect"}break;
    case"syncnow":await syncNow(true);break;
    case"syncoff":await removeSync();break;
    case"openreport":S.report.seen=true;Local.put("meta","report",S.report);S.edit={kind:"report"};renderSheet();break;
    case"closereport":S.edit=null;renderSheet();renderView();break;
    case"closesum":S.edit=null;renderSheet();renderView();break;
    case"filltgt":{const it=S.edit.w.items[+d.i];const co=coachFor(it.ex,S.edit.w);it.sets.forEach((x,j)=>{const t=tgtAt(co,j);if(!t)return;if(x.w===""||x.w==null)x.w=t.w;if(x.r===""||x.r==null)x.r=t.r});rerenderSheetKeepScroll();scheduleSave();break}
    case"addset":{const it=S.edit.w.items[+d.i];const l=it.sets[it.sets.length-1];it.sets.push({w:l?l.w:"",r:""});rerenderSheetKeepScroll();scheduleSave();break}
    case"rmset":S.edit.w.items[+d.i].sets.splice(+d.j,1);rerenderSheetKeepScroll();scheduleSave();break;
    case"rmex":S.edit.w.items.splice(+d.i,1);rerenderSheetKeepScroll();scheduleSave();break;
    case"ask":S.confirm=d.k||null;if(S.edit)rerenderSheetKeepScroll();else renderView();break;
    case"delw":{const id=S.edit.id;clearTimeout(saveTimer);S.edit.dirty=false;await saving;try{await S.wcol.doc(id).delete();S.edit=null;S.confirm=null;renderSheet();toast("Workout deleted")}catch(e){toast("Couldn't delete. Try again.")}break}
    case"applyr":{const r=(S.profile.routines||[]).find(x=>x.id===d.id);if(!r)break;const w=S.edit.w;w.items=routineItems(r);if(!w.name||w.name==="Workout")w.name=r.name;S.edit.stage=null;renderSheet();scheduleSave();break}
    case"blankstart":S.edit.stage=null;renderSheet();S.layer={kind:"pick",q:"",m:""};renderLayer();break;
    case"upex":{const it=S.edit.w.items;const i=+d.i;[it[i-1],it[i]]=[it[i],it[i-1]];rerenderSheetKeepScroll();scheduleSave();break}
    case"swapex":S.layer={kind:"pick",q:"",m:"",swap:+d.i};renderLayer();break;
    case"pick":S.layer={kind:"pick",q:"",m:""};renderLayer();setTimeout(()=>$("#pk-q")?.focus(),50);break;
    case"pkm":S.layer.m=d.m;renderLayer();break;
    case"pickex":{if(S.edit.kind==="workout"&&S.layer&&S.layer.swap!=null){S.edit.w.items[S.layer.swap].ex=d.ex;scheduleSave();S.layer=null;renderLayer();rerenderSheetKeepScroll();break}
      if(S.edit.kind==="workout"){const prev=prevFor(d.ex,S.edit.w);S.edit.w.items.push({ex:d.ex,sets:Array.from({length:prev?prev.sets.length:3},()=>({w:"",r:""}))});scheduleSave()}else S.edit.r.items.push({ex:d.ex,sets:3});S.layer=null;renderLayer();rerenderSheetKeepScroll();const b=document.querySelector("#sheet .sh-b");if(b)b.scrollTop=b.scrollHeight;break}
    case"hist":S.layer={kind:"hist",ex:d.ex};renderLayer();break;
    case"closel":S.layer=null;renderLayer();break;
    case"newr":S.edit={kind:"routine",isNew:true,r:{id:"r"+Date.now().toString(36),name:"",items:[]}};S.confirm=null;renderSheet();break;
    case"editr":{const r=(S.profile.routines||[]).find(x=>x.id===d.id);if(r){S.edit={kind:"routine",r:JSON.parse(JSON.stringify(r))};S.confirm=null;renderSheet()}break}
    case"closer":S.edit=null;S.confirm=null;renderSheet();break;
    case"upr":{const it=S.edit.r.items;const i=+d.i;[it[i-1],it[i]]=[it[i],it[i-1]];renderSheet();break}
    case"rmrex":S.edit.r.items.splice(+d.i,1);renderSheet();break;
    case"saver":{const r=S.edit.r;if(!r.name.trim()){toast("Give the routine a name");$("#r-name")?.focus();break}
      const rs=(S.profile.routines||[]).filter(x=>x.id!==r.id);const idx=(S.profile.routines||[]).findIndex(x=>x.id===r.id);
      if(idx>=0)rs.splice(idx,0,r);else rs.push(r);S.profile.routines=rs;S.edit=null;renderSheet();render();await saveProfile();toast("Routine saved");break}
    case"delr":S.profile.routines=(S.profile.routines||[]).filter(x=>x.id!==S.edit.r.id);S.edit=null;S.confirm=null;renderSheet();render();await saveProfile();break;
    case"units":S.profile.units=d.u;render();await saveProfile();break;
    case"metric":S.metric=d.k;renderView();break;
    case"delst":try{await S.scol.doc(d.d).delete();S.confirm=null}catch(e){toast("Couldn't delete. Try again.")}break;
    case"cmp":{const i=S.cmp.indexOf(d.id);if(i>=0)S.cmp.splice(i,1);else{S.cmp.push(d.id);if(S.cmp.length>2)S.cmp.shift()}S.confirm=null;renderView();break}
    case"clrcmp":S.cmp=[];renderView();break;
    case"delph":{const p=S.photos.find(x=>x.id===S.cmp[0]);if(!p)break;try{await S.phcol.doc(p.id).delete();if(S.assets)await S.assets.delete(p.asset).catch(()=>{});S.cmp=[];S.confirm=null;toast("Photo deleted")}catch(e){toast("Couldn't delete. Try again.")}break}
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="pk-q"){S.layer.q=el.value;const pos=el.selectionStart;renderLayer();const n=$("#pk-q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}return}
  if(!S.edit)return;
  if(S.edit.kind==="workout"){
    if(el.dataset.f){S.edit.w[el.dataset.f]=el.value;scheduleSave();return}
    if(el.dataset.k){const s=S.edit.w.items[+el.dataset.i].sets[+el.dataset.j];s[el.dataset.k]=el.value;scheduleSave();refreshMarks(+el.dataset.i)}
  }else{
    if(el.dataset.rf)S.edit.r.name=el.value;
    if(el.dataset.ri!=null)S.edit.r.items[+el.dataset.ri].sets=Math.max(1,Math.min(20,parseInt(el.value)||1));
  }
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="imp-file"&&ev.target.files[0]){readImport(ev.target.files[0]);return}
  if(ev.target.dataset.xs){const ex=ev.target.dataset.ex,k=ev.target.dataset.xs;const all=S.profile.exSettings=S.profile.exSettings||{};const cur=all[ex]=all[ex]||{};
    const v=k==="inc"?num(ev.target.value):parseInt(ev.target.value);if(v>0)cur[k]=v;else delete cur[k];
    if(cur.min&&cur.max&&cur.min>cur.max)[cur.min,cur.max]=[cur.max,cur.min];
    saveProfile();if(S.edit?.kind==="workout")rerenderSheetKeepScroll();return}
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==="statform"){
    const date=$("#st-date").value;if(!date){toast("Pick a date");return}
    const body={date};let any=false;["weight","bf","waist","chest","arms","thighs"].forEach(k=>{const v=num($("#st-"+k).value);body[k]=v;if(v!=null)any=true});
    if(!any){toast("Enter at least one measurement");return}
    const ex=S.stats.find(s=>s.date===date);if(ex)["weight","bf","waist","chest","arms","thighs"].forEach(k=>{if(body[k]==null&&ex[k]!=null)body[k]=ex[k]});
    try{await S.scol.doc(date).set(body);toast("Saved");queueSync()}catch(e){toast("Couldn't save. Try again.")}
  }
  if(f.id==="customform"){
    const name=$("#cx-name").value.trim();if(!name){toast("Name the exercise");return}
    const p=$("#cx-p").value,s=$("#cx-s").value;const id="c"+Date.now().toString(36);
    S.profile.custom=(S.profile.custom||[]).concat([{id,name,p:[p],s:s&&s!==p?[s]:[]}]);
    await saveProfile();
    const btn=document.createElement("button");btn.dataset.act="pickex";btn.dataset.ex=id;btn.hidden=true;document.body.appendChild(btn);btn.click();btn.remove();
  }
  if(f.id==="photoform"){
    const file=$("#ph-file").files[0];if(!file){toast("Choose a photo first");return}
    const go=$("#ph-go");go.disabled=true;go.textContent="Uploading…";
    try{
      const blob=await shrink(file);
      const res=await S.assets.upload(blob,{type:blob.type||"image/jpeg"});
      await S.phcol.doc().set({date:$("#ph-date").value||ymd(new Date()),pose:$("#ph-pose").value,asset:res.id,created:Date.now()});
      toast("Photo added");f.reset();$("#ph-date").value=ymd(new Date());
    }catch(e){const c=e?.code;toast(c==="quota_exceeded"?"Phone storage is full. Delete old photos to add more.":"Couldn't save the photo. Try again.")}
    finally{go.disabled=false;go.textContent="Add photo"}
  }
});
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.86));if(b)return b;
  }catch(e){}
  return file;
}

/* ---------- boot ---------- */
$("#bodydefs").innerHTML=BODY_DEFS;
render();
(async()=>{
  try{await Local.open()}catch(e){S.status="nodb";render();return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  S.assets=Local.assets;
  try{await mergeCustomIntoLib()}catch(e){}
  S.pref=Local.profile;
  S.wcol=S.pref.collection("workouts");S.scol=S.pref.collection("stats");S.phcol=S.pref.collection("photos");
  try{S.lastExport=await Local.get("meta","lastExport")}catch(e){}
  try{S.sync=await Local.get("meta","sync")||null;S.report=await Local.get("meta","report")||null}catch(e){}
  if(S.sync)setTimeout(()=>syncNow(false),3000);
  window.addEventListener("online",()=>queueSync(1000));
  let got=0;const ready=()=>{if(++got>=2&&S.status==="loading"){S.status="ok";render()}};
  const onErr=()=>{toast("Couldn't read saved data on this phone.")};
  S.pref.onSnapshot(s=>{if(s.exists){const d=s.data();S.profile={routines:d.routines||[],custom:d.custom||[],units:d.units||"lb",exSettings:d.exSettings||{}}}ready();if(S.status==="ok"&&!S.edit)render()},onErr);
  S.wcol.orderBy("date","desc").limit(1000).onSnapshot(q=>{S.workouts=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date===b.date?(b.created||0)-(a.created||0):(a.date<b.date?1:-1));ready();if(S.status==="ok")renderView()},onErr);
  S.scol.onSnapshot(q=>{S.stats=q.docs.map(d=>d.data());if(S.status==="ok")renderView()},onErr);
  S.phcol.onSnapshot(async q=>{
    S.photos=q.docs.map(d=>({id:d.id,...d.data()}));S.cmp=S.cmp.filter(id=>S.photos.some(p=>p.id===id));
    const keep=new Set(S.photos.map(p=>p.asset));
    Object.keys(S.urls).forEach(k=>{if(!keep.has(k)){URL.revokeObjectURL(S.urls[k]);delete S.urls[k]}});
    await Promise.all(S.photos.filter(p=>!S.urls[p.asset]).map(async p=>{try{const b=await Local.assets.get(p.asset);if(b)S.urls[p.asset]=URL.createObjectURL(b)}catch(e){}}));
    if(S.status==="ok")renderView();
  },onErr);
  setTimeout(()=>{if(S.status==="loading"){S.status="ok";render()}},6000);
})();
/* offline support: the service worker keeps a copy of the app on the phone */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
